[workspace]
resolver = "3"
members = ["core_bin", "core_lib", "plugins/*", "services/*"]

[workspace.dependencies]
async-trait = "0.1.89"
error_set = "0.9.1"
itertools = "0.14.0"
kameo = "0.20.0"
mlua = { version = "0.11.6", features = ["lua55", "vendored", "async", "send"] }
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [ "sqlite", "migrate", "runtime-tokio-rustls", "time" ] }
time = "0.3.47"
tokio = "1.50.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
