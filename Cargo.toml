[workspace]
resolver = "3"
members = ["core_bin", "core_lib"]

[workspace.dependencies]
error_set = "0.9.1"
kameo = "0.19.2"
mlua = { version = "0.11.6", features = ["lua55", "vendored", "async", "send"] }
sqlx = { version = "0.8.6", features = [ "sqlite", "migrate", "runtime-tokio-rustls" ] }
tokio = "1.50.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
